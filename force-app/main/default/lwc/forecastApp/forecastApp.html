<template>
    <template if:true={openModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close" onclick={handleCloseModal}></lightning-button-icon>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Disable Forecasting</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-spinner alternative-text="Loading" if:true={isLoading}></lightning-spinner>
                    <p>{labels.disableForecast}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseModal} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Disable" variant="destructive" onclick={handleDisableForecasting}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
    <lightning-card title="">
        <lightning-spinner alternative-text="Loading" if:true={isLoading}></lightning-spinner>
        <div class="slds-grid slds-wrap forecasting">
            <div class="slds-col slds-size_3-of-12 forecasting__controls">
                <div class="control__panel--margin">
                    <c-lookup errors={errors} onsearch={handleLookupSearch} selection={initialSelection}
                        onselectionchange={handleLookupSelectionChange} label={labels.accountSelectLabel}
                        placeholder="Search...">
                    </c-lookup>
                </div>

                <template if:true={displayDisableForecasting}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_small">
                        <div class="slds-text-title_bold slds-m-bottom_x-small">Account Actions</div>
                        <div class="slds-button-group-row">
                            <lightning-button variant="destructive-text" label="Disable Forecasting"
                                              onclick={disableForecasting} disabled={isReadOnlyPermission}
                                              icon-name="utility:ban" class="slds-m-right_x-small">
                            </lightning-button>
                            <template if:true={displayProductList}>
                                <lightning-button variant="destructive-text" label="Delete All Data"
                                                onclick={deleteAllProducts} disabled={isReadOnlyPermission}
                                                icon-name="utility:delete">
                                </lightning-button>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:true={displayAddProduct}>
                    <div class="control__panel--margin">
                        <c-forecast-enable-product onrefresh={handleRefresh} disabled={isReadOnlyPermission}
                            account-id={recordId} volume={selectedVolume} local-warehouse-codes={localWarehouseCodes}>
                        </c-forecast-enable-product>
                    </div>
                </template>

                <template if:true={displayVolumeFilter}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_small">
                        <div class="slds-text-title_bold slds-m-bottom_x-small">Display Settings</div>
                        <lightning-combobox name="volumes" label={labels.volumeSelectLabel} options={volumeOptions}
                            value={selectedVolume} onchange={handleVolumeChange} class="slds-m-bottom_small">
                        </lightning-combobox>
                        <div class="slds-form-element">
                            <label class="slds-form-element__label">Month View</label>
                            <lightning-button-group>
                                <lightning-button label="12 Months" onclick={handleMonthToggle} data-months="12" variant={is12MonthVariant}></lightning-button>
                                <lightning-button label="24 Months" onclick={handleMonthToggle} data-months="24" variant={is24MonthVariant}></lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </template>

                <template if:true={displayProductSearch}>
                    <div class="slds-box slds-theme_shade slds-m-bottom_small">
                        <div class="slds-text-title_bold slds-m-bottom_x-small">Search Products</div>
                        <lightning-input name="productSearch" label="" value={searchTerm}
                            type="search" placeholder="Search products..." onchange={handleProductSearch}>
                        </lightning-input>
                    </div>
                </template>

                <template lwc:if={displayNoAccountSelection}>

                </template>
                <template lwc:else>
                    <div class="slds-box slds-theme_shade slds-m-bottom_small">
                        <div class="slds-text-title_bold slds-m-bottom_x-small">Import CSV File</div>
                        <p class="slds-text-body_small slds-m-bottom_x-small">Upload forecast data for this account using a CSV file.</p>
                        <p class="slds-text-body_small slds-m-bottom_small"><strong>Required columns:</strong> PRODUCT2ID, Direct, Local, Month (MM/DD/YYYY), UNITPRICE, Quantity, Warehouse</p>

                        <div class="slds-grid slds-wrap slds-gutters_x-small">
                            <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                                <lightning-input type="file"
                                                label="Select CSV File"
                                                accept=".csv"
                                                onchange={importcsv}>
                                </lightning-input>
                            </div>

                            <template if:true={filename}>
                                <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                                    <span class="slds-text-body_small slds-text-color_success">
                                        <lightning-icon icon-name="utility:check" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        {filename}
                                    </span>
                                </div>
                            </template>
                            <template if:true={fileError}>
                                <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                                    <span class="slds-text-body_small slds-text-color_error">
                                        <lightning-icon icon-name="utility:error" size="xx-small" class="slds-m-right_xx-small" variant="error"></lightning-icon>
                                        {fileError}
                                    </span>
                                </div>
                            </template>

                            <div class="slds-col slds-size_1-of-1">
                                <div class="slds-button-group-row">
                                    <lightning-button variant="brand-outline" label="Download Template" icon-name="utility:download" onclick={downloadTemplate} class="slds-m-right_x-small"></lightning-button>
                                    <template if:true={displayProductList}>
                                        <lightning-button variant="brand" label="Import Data" icon-name="utility:upload" onclick={handleFileImport}></lightning-button>
                                    </template>
                                    <template if:false={displayProductList}>
                                        <lightning-button variant="brand" label="Import Data" icon-name="utility:upload" onclick={readFiles}></lightning-button>
                                    </template>
                                    <template if:true={showLoadingSpinner}>
                                        <lightning-spinner alternative-text="Uploading..." size="small" class="slds-m-left_small"></lightning-spinner>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-m-top_small">
                        <template lwc:if={displayProductDetails}>
                            <c-forecast-historical-table account-id={recordId} product-id={productId}>
                            </c-forecast-historical-table>
                        </template>
                        <template lwc:else>
                            <c-forecast-historical-table account-id={recordId}>
                            </c-forecast-historical-table>
                        </template>
                    </div>
                </template>

            </div>
            <div class="slds-col slds-size_9-of-12 forecasting__data">
                <template if:true={displayNoAccountSelection}>
                    <div class="center font--big">
                        <h1>{labels.accountSelect}</h1>
                    </div>
                </template>

                <template if:true={displayNoForecastEnabled}>
                    <div class="center">
                        <h1 class="font--big">{labels.forecastEnable}</h1>
                    </div>
                    <div class="center">
                        <lightning-button class="forecast__enable__btn" variant="brand" label="Enable Forecasting"
                            onclick={enableForecasting} disabled={isReadOnlyPermission} volume={selectedVolume}>
                        </lightning-button>
                    </div>
                </template>

                <template if:true={displayNoForecastData}>
                    <div class="center">
                        <h1 class="font--big">{labels.forecastNoData}</h1>
                    </div>
                    <div class="center">
                        <c-forecast-enable-product disabled={isReadOnlyPermission} onrefresh={handleRefresh}
                            account-id={recordId} volume={selectedVolume} local-warehouse-codes={localWarehouseCodes}
                            currency-code={currencyCODE}>
                        </c-forecast-enable-product>
                    </div>
                </template>

                <template if:true={displayProductList}>
                    <c-forecast-product-list disabled={isReadOnlyPermission} account-id={recordId}
                        onproductselect={handleProductSelect} oncurrentpage={handlePageSelect} page-number={pageNumber}
                        search-term={searchTerm} volume={selectedVolume}
                        currency-code={currencyCODE} months-view={monthsView}>
                    </c-forecast-product-list>
                </template>

                <template if:true={displayProductDetails}>
                    <c-forecast-product-details product-id={productId} disabled={isReadOnlyPermission} price={price} direct={direct}
                        account-id={recordId} onback={handleBack} volume={selectedVolume}
                        local-warehouse-codes={localWarehouseCodes}
                        ondisabled={handleDisabled}
                        currency-code={currencyCODE} months-view={monthsView}>
                    </c-forecast-product-details>
                </template>

                
            </div>
        </div>
    </lightning-card>
</template>
