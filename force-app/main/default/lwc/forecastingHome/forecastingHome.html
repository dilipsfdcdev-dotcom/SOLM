<template>
    <lightning-card title="Forecasting Management" icon-name="standard:forecasts">
        <div slot="actions">
            <template lwc:if={showBackButton}>
                <lightning-button variant="neutral" label="Back to Menu" icon-name="utility:chevronleft" onclick={handleBackToMenu}></lightning-button>
            </template>
        </div>

        <template lwc:if={searchByAccount}>
            <c-forecast-app></c-forecast-app>
        </template>
        <template lwc:elseif={searchByProduct}>
            <c-forecast-app-for-product></c-forecast-app-for-product>
        </template>
        <template lwc:elseif={showMassUpload}>
            <div class="slds-p-around_medium slds-is-relative">
                <template lwc:if={isMassLoading}>
                    <lightning-spinner alternative-text="Processing upload..." size="large" class="slds-spinner_container"></lightning-spinner>
                </template>
                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Left Column: Instructions -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_medium">
                        <div class="slds-box slds-theme_shade" style="height: 100%;">
                            <div class="slds-text-heading_small slds-m-bottom_small">
                                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_x-small"></lightning-icon>
                                Upload Instructions
                            </div>
                            <p class="slds-m-bottom_small">Upload forecast data for multiple accounts at once using a CSV file.</p>
                            <div class="slds-text-title_bold slds-m-bottom_x-small">Required Columns:</div>
                            <ul class="slds-list_dotted slds-m-bottom_small">
                                <li><strong>AccountId</strong> - Salesforce Account ID (15 or 18 characters)</li>
                                <li><strong>PRODUCT2ID</strong> - Salesforce Product ID</li>
                                <li><strong>Direct</strong> - true/false for Direct Shipment</li>
                                <li><strong>Local</strong> - true/false for Local Warehouse</li>
                                <li><strong>Month</strong> - Date in MM/DD/YYYY format</li>
                                <li><strong>UNITPRICE</strong> - Unit price for the product</li>
                                <li><strong>Quantity</strong> - Forecast quantity</li>
                                <li><strong>Warehouse</strong> - Warehouse name (optional)</li>
                            </ul>
                        </div>
                    </div>

                    <!-- Right Column: Upload Form -->
                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                        <div class="slds-box slds-theme_default" style="height: 100%;">
                            <div class="slds-text-heading_small slds-m-bottom_medium">
                                <lightning-icon icon-name="utility:upload" size="small" class="slds-m-right_x-small"></lightning-icon>
                                Upload File
                            </div>

                            <div class="slds-form-element slds-m-bottom_medium">
                                <lightning-input
                                    type="file"
                                    label="Select CSV File"
                                    accept=".csv"
                                    onchange={handleMassFileSelect}>
                                </lightning-input>
                            </div>

                            <template lwc:if={massFileName}>
                                <div class="slds-m-bottom_small">
                                    <span class="slds-badge slds-badge_success">
                                        <lightning-icon icon-name="utility:check" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        {massFileName}
                                    </span>
                                </div>
                            </template>

                            <template lwc:if={massFileError}>
                                <div class="slds-m-bottom_small">
                                    <span class="slds-text-color_error slds-text-body_small">
                                        <lightning-icon icon-name="utility:error" size="xx-small" class="slds-m-right_xx-small" variant="error"></lightning-icon>
                                        {massFileError}
                                    </span>
                                </div>
                            </template>

                            <div class="slds-button-group-row slds-m-top_medium">
                                <lightning-button
                                    variant="neutral"
                                    label="Download Template"
                                    icon-name="utility:download"
                                    onclick={downloadMassTemplate}
                                    class="slds-m-right_x-small">
                                </lightning-button>
                                <lightning-button
                                    variant="brand"
                                    label="Upload Forecasts"
                                    icon-name="utility:upload"
                                    onclick={handleMassUpload}
                                    disabled={isMassUploadDisabled}>
                                </lightning-button>
                                <template lwc:if={isMassLoading}>
                                    <lightning-spinner alternative-text="Processing..." size="small" class="slds-m-left_small"></lightning-spinner>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results Section -->
                <template lwc:if={massUploadResult}>
                    <div class="slds-m-top_medium">
                        <div class={massResultClass} style="padding: 1rem;">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name={massResultIcon} size="small" class="slds-m-right_small" inverse></lightning-icon>
                                <span class="slds-text-body_regular" style="white-space: pre-wrap;">{massUploadResult}</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_large home-container">
                <!-- Hero Section -->
                <div class="hero-section slds-m-bottom_large">
                    <h1 class="hero-title">Select an Option</h1>
                    <p class="hero-subtitle">Choose how you'd like to manage your forecasts</p>
                </div>

                <!-- Menu Cards Grid -->
                <div class="slds-grid slds-wrap slds-gutters slds-grid_align-center">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_small">
                        <div class="menu-card menu-card-account" onclick={hanldeSearchByAccount}>
                            <div class="card-icon-wrapper">
                                <lightning-icon icon-name="standard:account" size="large"></lightning-icon>
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">Search By Account</h3>
                                <p class="card-description">Manage forecasts for a specific account</p>
                            </div>
                            <div class="card-arrow">
                                <lightning-icon icon-name="utility:chevronright" size="small"></lightning-icon>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_small">
                        <div class="menu-card menu-card-product" onclick={hanldeSearchByProduct}>
                            <div class="card-icon-wrapper">
                                <lightning-icon icon-name="standard:product" size="large"></lightning-icon>
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">Search By Product</h3>
                                <p class="card-description">View forecasts across all accounts for a product</p>
                            </div>
                            <div class="card-arrow">
                                <lightning-icon icon-name="utility:chevronright" size="small"></lightning-icon>
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-p-around_small">
                        <div class="menu-card menu-card-upload" onclick={handleMassUploadClick}>
                            <div class="card-icon-wrapper">
                                <lightning-icon icon-name="standard:file" size="large"></lightning-icon>
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">Mass Upload</h3>
                                <p class="card-description">Upload forecasts for multiple accounts via CSV</p>
                            </div>
                            <div class="card-arrow">
                                <lightning-icon icon-name="utility:chevronright" size="small"></lightning-icon>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
